<!-- Контейнер для уведомлений -->
<div id="notification-container"></div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>

<script>
    // ============================================================
    // Данные публикаций загружены из внешнего файла papers-data.js
    // ============================================================

    // ===== СИСТЕМА УВЕДОМЛЕНИЙ =====
    function showNotification(type, title, message) {
        const container = document.getElementById('notification-container');
        const notification = document.createElement('div');
        notification.className = `notification ${type}`;
        
        const icon = document.createElement('div');
        icon.className = 'notification-icon';
        icon.innerHTML = type === 'success' ? '✓' : '✕';
        
        const textWrapper = document.createElement('div');
        textWrapper.className = 'notification-text';
        const titleEl = document.createElement('div');
        titleEl.className = 'notification-title';
        titleEl.textContent = title;
        const messageEl = document.createElement('div');
        messageEl.className = 'notification-message';
        messageEl.textContent = message;
        textWrapper.appendChild(titleEl);
        textWrapper.appendChild(messageEl);
        
        notification.appendChild(icon);
        notification.appendChild(textWrapper);
        container.appendChild(notification);
        
        notification.offsetHeight;
        notification.classList.add('show');
        
        const hideTimeout = setTimeout(() => {
            hideNotification(notification);
        }, 4000);
        
        notification.addEventListener('click', () => {
            clearTimeout(hideTimeout);
            hideNotification(notification);
        });
    }

    function hideNotification(notification) {
        notification.classList.remove('show');
        notification.classList.add('hide');
        setTimeout(() => notification.remove(), 300);
    }

    // ===== РЕНДЕРИНГ ТАБЛИЦЫ =====
    const tbody = document.querySelector('#publicationsTable tbody');

    function createLevelBadge(levelKey) {
        if (levelKey === 'vak1') {
            return '<span class="level-badge level-vak1">ВАК (К1)</span>';
        } else if (levelKey === 'vak3') {
            return '<span class="level-badge level-vak3">ВАК (К3)</span>';
        } else if (levelKey === 'vak2') {
            return '<span class="level-badge level-vak2">ВАК (К2)</span>';
        } else if (levelKey === 'rinc') {
            return '<span class="level-badge level-rinc">РИНЦ</span>';
        } else {
            return '<span class="level-badge level-other">Другое</span>';
        }
    }

    function renderTable(data) {
        tbody.innerHTML = '';
        data.forEach((item) => {
            const tr = document.createElement('tr');
            let levelsArray = [];
            if (item.level) {
                levelsArray = item.level.split(',').map(s => s.trim()).filter(s => s);
            }
            tr.dataset.year = item.year;
            tr.dataset.level = levelsArray.join(',');

            let badgesHtml = levelsArray.map(levelKey => createLevelBadge(levelKey)).join(' ');

            const hasStandard = levelsArray.some(l => l === 'rinc' || l === 'vak1' || l === 'vak3');
            const elibLabel = hasStandard ? 'eLibrary' : 'Ссылка';

            const biblioAttr = item.biblio.replace(/"/g, '&quot;');

            let authorsHtml = item.authors;
            if (item.authors && item.authors !== '—') {
                const authorsList = item.authors.split(',').map(a => a.trim());
                authorsHtml = authorsList.map(a => `<span class="author-nowrap">${a}</span>`).join(', ');
            } else {
                authorsHtml = item.authors;
            }

            tr.innerHTML = `
                <td data-label="Год" class="center">${item.year}</td>
                <td data-label="Название">${item.title}</td>
                <td data-label="Соавторы" class="center">${authorsHtml}</td>
                <td data-label="Сборник">${item.journal}</td>
                <td data-label="Уровень" class="center">${badgesHtml}</td>
                <td data-label="Действия" class="actions-cell center">
                    <a href="#" class="btn-sm btn-elibrary" data-link="${item.elink}" target="_blank" title="Открыть ссылку">${elibLabel}</a>
                    <button class="btn-sm biblio-btn" data-biblio="${biblioAttr}" title="Копировать цитирование">Цитировать</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
        updateCount(data.length);
    }

    // ===== ОБРАБОТЧИКИ =====
    document.querySelector('#publicationsTable').addEventListener('click', function(e) {
        const btn = e.target.closest('.btn-elibrary');
        if (!btn) return;
        e.preventDefault();
        const link = btn.dataset.link;
        if (!link || link === '#') {
            showNotification('error', 'Ссылка отсутствует', 'Для этой работы не указана ссылка.');
        } else {
            window.open(link, '_blank');
        }
    });

    document.querySelector('#publicationsTable').addEventListener('click', function(e) {
        const btn = e.target.closest('.biblio-btn');
        if (!btn) return;
        const biblioText = btn.dataset.biblio;
        if (!biblioText) {
            showNotification('error', 'Библиография отсутствует', 'Для этой работы не указана библиографическая ссылка.');
            return;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(biblioText).then(() => {
                showNotification('success', 'Скопировано!', 'Библиографическая ссылка скопирована в буфер обмена.');
            }).catch(() => fallbackCopy(biblioText));
        } else {
            fallbackCopy(biblioText);
        }
    });

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            showNotification('success', 'Скопировано!', 'Библиографическая ссылка скопирована в буфер обмена.');
        } catch (e) {
            showNotification('error', 'Ошибка', 'Не удалось скопировать текст. Попробуйте вручную.');
        }
        document.body.removeChild(textarea);
    }

    // ===== ФИЛЬТРЫ =====
    const filterYear = document.getElementById('filterYear');
    const filterLevel = document.getElementById('filterLevel');
    const filterSearch = document.getElementById('filterSearch');
    const clearBtn = document.getElementById('clearFilters');
    const resultSpan = document.getElementById('resultCount');

    function filterTable() {
        const yearVal = filterYear.value;
        const levelVal = filterLevel.value;
        const searchVal = filterSearch.value.toLowerCase().trim();

        const rows = tbody.querySelectorAll('tr');
        let visibleCount = 0;

        rows.forEach(row => {
            const rowYear = row.dataset.year;
            const rowLevels = row.dataset.level ? row.dataset.level.split(',') : [];
            const textContent = row.textContent.toLowerCase();

            let show = true;
            if (yearVal !== 'all' && rowYear !== yearVal) show = false;
            if (levelVal !== 'all' && !rowLevels.includes(levelVal)) show = false;
            if (searchVal && !textContent.includes(searchVal)) show = false;

            row.style.display = show ? '' : 'none';
            if (show) visibleCount++;
        });
        updateCount(visibleCount);
    }

    function updateCount(count) {
        resultSpan.textContent = `Показано: ${count} из ${papersData.length}`;
    }

    filterYear.addEventListener('change', filterTable);
    filterLevel.addEventListener('change', filterTable);
    filterSearch.addEventListener('input', filterTable);
    clearBtn.addEventListener('click', function() {
        filterYear.value = 'all';
        filterLevel.value = 'all';
        filterSearch.value = '';
        filterTable();
    });

    // ===== ИНИЦИАЛИЗАЦИЯ =====
    if (typeof papersData !== 'undefined' && Array.isArray(papersData)) {
        renderTable(papersData);
    } else {
        console.error('Данные публикаций не загружены. Убедитесь, что файл papers-data.js подключен.');
        document.querySelector('#publicationsTable tbody').innerHTML = '<tr><td colspan="6" style="text-align:center;padding:20px;">⚠️ Данные временно недоступны. Попробуйте обновить страницу.</td></tr>';
    }
</script>
<script>
    // ===== ПЕРЕКЛЮЧЕНИЕ ТЕМЫ: цвет (5 акцентов) + режим (светлый/тёмный) =====
(function() {
    const COLORS = ['purple', 'orange', 'ocean', 'emerald', 'rose'];

    const root = document.documentElement;
    const dots = document.querySelectorAll('.theme-dot');
    const modeToggle = document.getElementById('modeToggle');
    const logo = document.getElementById('logo');
    const menu = document.getElementById('themeMenu');
    const trigger = document.getElementById('themeTrigger');

    function applyColor(color) {
        if (!COLORS.includes(color)) color = 'purple';

        COLORS.forEach(c => root.classList.remove('color-' + c));
        root.classList.add('color-' + color);

        dots.forEach(dot => {
            const isActive = dot.dataset.color === color;
            dot.classList.toggle('active', isActive);
            dot.setAttribute('aria-pressed', isActive ? 'true' : 'false');
        });

        localStorage.setItem('themeColor', color);
    }

    function applyMode(mode) {
        const isDark = mode === 'dark';
        root.classList.toggle('dark-theme', isDark);

        if (modeToggle) {
            modeToggle.setAttribute('aria-pressed', isDark ? 'true' : 'false');
        }
        if (logo) {
            logo.src = isDark ? 'logo-dark.png' : 'logo-light.png';
        }

        localStorage.setItem('themeMode', mode);
    }

    // Применяем сохранённые цвет и режим при загрузке
    const currentColor = localStorage.getItem('themeColor') || 'purple';
    const currentMode = localStorage.getItem('themeMode') || 'light';
    applyColor(currentColor);
    applyMode(currentMode);

    // Обработчик клика по точкам цвета
    dots.forEach(dot => {
        dot.addEventListener('click', function() {
            applyColor(this.dataset.color);
        });
    });

    // Обработчик клика по переключателю светлый/тёмный
    if (modeToggle) {
        modeToggle.addEventListener('click', function() {
            const isDark = root.classList.contains('dark-theme');
            applyMode(isDark ? 'light' : 'dark');
        });
    }

    // Открытие/закрытие меню тапом — на десктопе панель и так
    // раскрывается по наведению (см. CSS), это для сенсорных экранов
    if (menu && trigger) {
        trigger.addEventListener('click', function() {
            const isOpen = menu.classList.toggle('open');
            trigger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        });

        document.addEventListener('click', function(e) {
            if (!menu.contains(e.target)) {
                menu.classList.remove('open');
                trigger.setAttribute('aria-expanded', 'false');
            }
        });

        // после выбора цвета или режима на тач-экране меню можно сразу закрыть
        menu.addEventListener('click', function(e) {
            if (e.target.closest('.theme-dot') || e.target.closest('.mode-toggle')) {
                setTimeout(() => {
                    menu.classList.remove('open');
                    trigger.setAttribute('aria-expanded', 'false');
                }, 150);
            }
        });
    }
})();
</script>
